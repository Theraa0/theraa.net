<script>
// header stuff
document.getElementById("header-sub").innerHTML = "";
const path = window.location.pathname.replace(/\/$/g, "").split("/");
for (var i=1; i < path.length; i++) {
	const a = document.createElement("a");
	for (var j=1; j <= i; j++) {
		a.href= a.href + "/" + path[j];
	}
	a.innerText = "/" + path[i];
	document.getElementById("header-sub").appendChild(a);
//replace all isSectionLinks with buttons for semantics and fun
scrollIntoView = function(destination) {
}
anchorToButton = function(link) {
	var button = document.createElement("button");
	button.innerHTML = link.innerHTML;
	button.id = link.id;
	for ( var i = 0; i < link.classList.length; i++ ) {
		button.classList.add(link.classList[i]);
	}
	const destination = link.hash.replace("#", "");
	//console.log(destination);
	//button.onclick = function() { document.getElementById(destination).scrollIntoView({behaviour: "smooth"}); }
	button.setAttribute("onclick", 'document.getElementById("' + destination + '").scrollIntoView({behavior: "smooth"})');
	var linkParent = link.parentNode;
	linkParent.replaceChild(button, link);
}
const sectionLinks = document.getElementsByClassName("isSectionLink");
for ( var i = 0; i < sectionLinks.length; i++ ) {
	anchorToButton( sectionLinks[i] );
}

</script>
